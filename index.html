<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Papyr - Sistema Bibliotecário Escolar</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='black' rx='6'/><text x='16' y='22' fill='white' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='18'>P.</text></svg>" type="image/svg+xml">

    <!-- Styles & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-green: #BCFFB1;
            --brand-black: #0D0D0D;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FFFFFF;
            color: var(--brand-black);
            margin: 0;
            overflow: hidden;
        }

        .dot-pattern {
            background-image: radial-gradient(#000 0.5px, transparent 0.5px);
            background-size: 32px 32px;
        }

        /* Ciclo de Animação de 10 segundos */
        
        /* 1. O corpo do papiro fechando (Aberto largo -> Haste Vertical) */
        @keyframes papyrus-closing {
            0%, 2% { transform: scaleX(4) scaleY(0.4); opacity: 0; }
            8%, 12% { transform: scaleX(3.5) scaleY(0.5); opacity: 1; }
            30%, 96% { transform: scaleX(1) scaleY(1.1); opacity: 1; } /* Fica formado até quase o final */
            98%, 100% { transform: scaleX(0.8) scaleY(1.2); opacity: 0; }
        }

        /* 2. As escritas onduladas dentro do papiro */
        @keyframes wavy-lines {
            0%, 12% { opacity: 0.4; stroke-dashoffset: 0; }
            25%, 100% { opacity: 0; stroke-dashoffset: 50; }
        }

        /* 3. Hastes de madeira acompanhando o fechamento lateral */
        @keyframes rods-closing {
            0%, 2% { opacity: 0; }
            8% { opacity: 1; }
            96% { opacity: 1; }
            98%, 100% { opacity: 0; }
        }

        @keyframes rod-left {
            0%, 12% { transform: translateX(-18px); }
            30%, 100% { transform: translateX(0px); }
        }

        @keyframes rod-right {
            0%, 12% { transform: translateX(18px); }
            30%, 100% { transform: translateX(0px); }
        }

        /* 4. A dobra superior do P (O Loop) */
        @keyframes p-loop-final {
            0%, 30% { stroke-dashoffset: 70; opacity: 0; transform: scale(0.95); }
            45%, 96% { stroke-dashoffset: 0; opacity: 1; transform: scale(1); }
            98%, 100% { opacity: 0; }
        }

        /* 5. Texto "apyr" entrando sincronizado */
        @keyframes apyr-reveal-sync {
            0%, 50% { opacity: 0; transform: translateX(-10px); filter: blur(10px); }
            62%, 96% { opacity: 1; transform: translateX(0px); filter: blur(0px); }
            98%, 100% { opacity: 0; transform: translateX(10px); }
        }

        /* 6. Efeito de Pulsação quando a logo está formada */
        @keyframes logo-pulse {
            0%, 62% { transform: scale(1); }
            75% { transform: scale(1.02); }
            88% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        .animate-papyrus-body { 
            animation: papyrus-closing 10s cubic-bezier(0.65, 0, 0.35, 1) infinite; 
            transform-origin: center; 
        }
        
        .animate-wavy { 
            stroke-dasharray: 50;
            animation: wavy-lines 10s ease-out infinite; 
        }

        .rod-l { animation: rod-left 10s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
        .rod-r { animation: rod-right 10s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
        .rod-container { animation: rods-closing 10s ease-in-out infinite; }

        .animate-p-loop { 
            stroke-dasharray: 70; 
            stroke-dashoffset: 70; 
            animation: p-loop-final 10s cubic-bezier(0.65, 0, 0.35, 1) infinite; 
            transform-origin: 20px 20px;
        }

        .animate-text-apyr-sync { 
            animation: apyr-reveal-sync 10s cubic-bezier(0.65, 0, 0.35, 1) infinite; 
        }

        .animate-logo-pulse {
            animation: logo-pulse 10s ease-in-out infinite;
        }

        .loading-bar-inner {
            animation: loading 2.5s infinite cubic-bezier(0.65, 0, 0.35, 1);
        }

        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }

        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }
        .animate-draw {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: draw 2.5s forwards;
        }
    </style>

{

</script>
</head>

</html>
